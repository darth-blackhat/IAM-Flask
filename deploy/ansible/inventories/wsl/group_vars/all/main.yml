---
# WSL (Ubuntu with systemd=true in /etc/wsl.conf) + Docker Desktop.
#
# Docker Desktop mode (default here): uses Desktop's engine. Enable it for this distro first:
#   Docker Desktop > Settings > Resources > WSL integration > Ubuntu: on
# The services are systemd units in WSL that wait for Docker Desktop and start once it runs
# (so: after you log in to Windows and Desktop starts).
backend_iam_install_docker: false
backend_iam_docker_unit: ""
backend_iam_docker_bin: /usr/bin/docker
backend_iam_build_docker: /usr/bin/docker
#
# Native mode instead (services run with WSL even without Desktop): comment the four lines
# above out. The role then installs docker.io inside Ubuntu; leave Desktop's WSL integration
# off for this distro so the two engines do not fight over /var/run/docker.sock.
backend_iam_build_become: true              # your user is not in the docker group

# Published on localhost; Windows reaches them through the proxy at https://localhost
# (web), https://localhost:9443 (oversight), https://localhost:8443 (API), or directly
# at http://localhost:8090 / 8091 / 8000.
backend_iam_producer_bind: "127.0.0.1:8000"
backend_iam_web_bind: "127.0.0.1:8090"

# Exports and inbox live in WSL. To exchange zips with Windows or a share, point these at
# a folder under /mnt/c/... or a mounted share instead.
backend_iam_mounts_by_service:
  producer:
    /srv/iam-exports: /data/exports
  consumer:
    /srv/iam-exports: /data/inbox             # same folder: producer -> consumer on one host

backend_iam_env:
  OPENIAM_BASE_URL: "{{ openiam_base_url }}"
  OPENIAM_CLIENT_ID: "{{ vault_openiam_client_id }}"
  OPENIAM_CLIENT_SECRET: "{{ vault_openiam_client_secret }}"
  DATABASE_URL: "{{ vault_database_url }}"
  DATABASE_SCHEMA: backend_iam
  LOG_LEVEL: INFO

backend_iam_env_by_service:
  producer:
    BACKEND_API_KEY: "{{ vault_backend_api_key }}"
    SYNC_WEBHOOK_SECRET: "{{ vault_sync_webhook_secret }}"
  web:
    WEB_USERNAME: admin
    WEB_PASSWORD: "{{ vault_web_password }}"
    WEB_SECRET_KEY: "{{ vault_web_secret_key }}"
  consumer:
    CONSUMER_TARGET: openiam
  oversight:
    CONSUMER_TARGET: openiam
    WEB_USERNAME: admin
    WEB_PASSWORD: "{{ vault_oversight_password }}"
    WEB_SECRET_KEY: "{{ vault_oversight_secret_key }}"

# One host serves everything: three HTTPS ports; a self-signed certificate for the lab.
backend_iam_proxy_self_signed: true
backend_iam_proxy_sites:
  - {name: web, listen: 443, upstream: "127.0.0.1:8090"}
  - {name: api, listen: 8443, upstream: "127.0.0.1:8000"}
  - {name: oversight, listen: 9443, upstream: "127.0.0.1:8091"}

openiam_base_url: https://openiam.example.com

# ---- no internet --------------------------------------------------------------
# Prepare once on a machine with internet: deploy/offline/download.sh (see
# deploy/offline/DOWNLOAD-LIST.md), then bring vendor/wheels/ and offline-bundle/ here.
backend_iam_offline_bundle: "{{ playbook_dir }}/../../offline-bundle"
# Hosts without Docker and without an apt mirror: .debs for their distribution
# (download.sh --debs ubuntu:24.04).
# backend_iam_docker_debs_dir: "{{ playbook_dir }}/../../offline-bundle/debs/ubuntu-24.04"
# backend_iam_apt_update: false
