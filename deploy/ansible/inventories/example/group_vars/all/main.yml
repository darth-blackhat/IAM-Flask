---
backend_iam_version: "0.1.0"
backend_iam_image_source: build        # or: registry (+ backend_iam_image: registry/.../backend-iam:0.1.0)

# Settings common to every service on a host. Secrets come from vault.yml (vault_*).
backend_iam_env:
  OPENIAM_BASE_URL: "{{ openiam_base_url }}"
  OPENIAM_CLIENT_ID: "{{ vault_openiam_client_id }}"
  OPENIAM_CLIENT_SECRET: "{{ vault_openiam_client_secret }}"
  OPENIAM_VERIFY_TLS: "true"
  DATABASE_URL: "{{ vault_database_url }}"
  DATABASE_SCHEMA: backend_iam
  LOG_LEVEL: INFO

backend_iam_env_by_service:
  producer:
    BACKEND_API_KEY: "{{ vault_backend_api_key }}"
    SYNC_WEBHOOK_SECRET: "{{ vault_sync_webhook_secret }}"
    APPROVALS_FOR_DESTRUCTIVE: "2"
    NOTIFY_CONFIG_PATH: /config/notify.yaml              # optional: email / webhooks
    NOTIFY_SMTP_PASSWORD: "{{ vault_notify_smtp_password }}"
    REPORTS_FOLDER: /data/reports
    JIRA_CHECK: "off"                                    # off | warn | enforce
    # JIRA_BASE_URL: https://yourcompany.atlassian.net
    # JIRA_ALLOWED_STATUSES: "Approved,In Progress"
    # JIRA_COMMENT: "true"
    # JIRA_USER: svc-iam@example.com
    # JIRA_API_TOKEN: "{{ vault_jira_api_token }}"
  web:
    WEB_USERNAME: admin
    WEB_PASSWORD: "{{ vault_web_password }}"           # first admin only
    WEB_SECRET_KEY: "{{ vault_web_secret_key }}"       # also seals the MFA secrets: keep it stable
    WEB_MFA_REQUIRED_ROLE: admin
    APPROVALS_FOR_DESTRUCTIVE: "2"
    JIRA_CHECK: "off"                                    # same value as the producer (enforce blocks approval)
    WEB_AUTH_MODE: local                                 # local | ldap | both (AD sign-in, read-only)
    # WEB_LDAP_URLS: ldaps://dc1.corp.example:636,ldaps://dc2.corp.example:636
    # WEB_LDAP_CA_FILE: /config/ad-ca.pem
    # WEB_LDAP_BIND_DN: CN=svc-iam-web,OU=Service Accounts,DC=corp,DC=example
    # WEB_LDAP_BIND_PASSWORD: "{{ vault_web_ldap_bind_password }}"
    # WEB_LDAP_BASE_DN: DC=corp,DC=example
    # WEB_LDAP_GROUP_ADMIN: CN=GRP-IAM-Admins,OU=Groups,DC=corp,DC=example
    # WEB_LDAP_GROUP_AUDITOR: CN=GRP-IAM-Auditors,OU=Groups,DC=corp,DC=example
  consumer:
    CONSUMER_TARGET: openiam                             # or: ad (site without OpenIAM)
    AD_BIND_PASSWORD: "{{ vault_ad_bind_password }}"
    NOTIFY_CONFIG_PATH: /config/notify.yaml              # this site's own email / webhooks
    NOTIFY_SMTP_PASSWORD: "{{ vault_notify_smtp_password }}"
  oversight:
    CONSUMER_TARGET: openiam
    WEB_USERNAME: admin
    WEB_PASSWORD: "{{ vault_oversight_password }}"
    WEB_SECRET_KEY: "{{ vault_oversight_secret_key }}"
    WEB_MFA_REQUIRED_ROLE: admin
    WEB_AUTH_MODE: local                                 # local | ldap | both (see web above)

# ---- no internet --------------------------------------------------------------
# Prepare once on a machine with internet: deploy/offline/download.sh (see
# deploy/offline/DOWNLOAD-LIST.md), then bring vendor/wheels/ and offline-bundle/ here.
backend_iam_offline_bundle: "{{ playbook_dir }}/../../offline-bundle"
# Hosts without Docker and without an apt mirror: .debs for their distribution
# (download.sh --debs ubuntu:24.04).
# backend_iam_docker_debs_dir: "{{ playbook_dir }}/../../offline-bundle/debs/ubuntu-24.04"
# backend_iam_apt_update: false
