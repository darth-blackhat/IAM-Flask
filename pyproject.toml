[project]
name = "backend-iam"
version = "0.1.0"
description = "Python backend that pushes user data into OpenIAM and pulls data out of it"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "loguru>=0.7",
    "flask>=3.0",
    "waitress>=3.0",
    "alembic>=1.13",
    "cryptography>=43",
    "pyrage>=1.2",
    "ldap3>=2.9",
    "watchdog>=5",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
iam = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
